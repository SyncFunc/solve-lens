[package]
name = "baobao-bashi"
version = "0.1.0"
description = "A keyboard-first visual question assistant"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
image = "0.25"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdh"] }
raw-window-handle = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
screenshots = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
